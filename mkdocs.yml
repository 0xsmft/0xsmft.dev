site_name: 0xsmft
repo_url: https://github.com/0xsmft/Saturn-Engine
repo_name: 0xsmft/Saturn-Engine
# The website version has two different versions, the numerical version i.e. 1.x.x is the documentation version
# whereas the UBID style i.e. X99(x)XX is the website version, so any changes to the websites properties
# such as a new plugin should change this value (only changing the incerment not the full UBID)
# A deleted/new page should modify both and in such a case a new UBID would need to be created.
copyright: Website version B57cOS, documentation version 1.8.6, generator MkDocs, ext. Material for MkDocs
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.footer
    - navigation.sections
    - navigation.expand
    - content.code.annotate
    - content.code.copy
    - content.tooltips
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/0xsmft
  generator: false
plugins:
  - awesome-nav
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg